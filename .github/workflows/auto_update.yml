name: Update CFG

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cfg-update
  cancel-in-progress: false

jobs:
  update-whitelist-file:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r source/requirements-dev.txt

      - name: Run tests
        run: python -m pytest source/test_main.py -q

      - name: Lint
        run: ruff check source/

      - name: Generate whitelist file
        run: python source/main.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add githubmirror/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update cfg"
          git push
